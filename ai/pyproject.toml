[project]
name = "dongne-ai"
version = "0.0.1"
description = "AI 시민 페르소나, 시장 보좌관, 화면 없는 실험"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dongne_ai"]
