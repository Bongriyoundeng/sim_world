[workspace]
resolver = "2"
members = ["crates/api", "crates/world", "crates/sim", "crates/py", "crates/godot"]
# crates/py(PyO3)는 libpython이 필요해 maturin으로, crates/godot(gdext)는 빌드가 무거워
# 기본 빌드·테스트에서 빼고 따로 빌드한다 (core/README.md)
default-members = ["crates/api", "crates/world", "crates/sim"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Bongriyoundeng/sim_world"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dongne-api = { path = "crates/api" }
dongne-world = { path = "crates/world" }
dongne-sim-core = { path = "crates/sim" }
