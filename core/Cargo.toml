[workspace]
resolver = "2"
members = ["crates/api", "crates/world", "crates/sim"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Bongriyoundeng/sim_world"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dongne-api = { path = "crates/api" }
dongne-world = { path = "crates/world" }
