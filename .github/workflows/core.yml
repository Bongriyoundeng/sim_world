name: core
on:
  push:
    branches: [main]
    paths: ["core/**", "tests/scenarios/**", "maps/**", ".github/workflows/core.yml"]
  pull_request:
    paths: ["core/**", "tests/scenarios/**", "maps/**", ".github/workflows/core.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo clippy -p dongne-py --features extension-module --all-targets -- -D warnings
      - run: cargo clippy -p dongne-godot --all-targets -- -D warnings
  python-binding:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/crates/py
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 .venv
      - run: uv pip install --python .venv maturin pytest
      - run: .venv/bin/maturin develop --uv
      - run: .venv/bin/python -m pytest -q tests
      - name: 시나리오 테스트 (tests/scenarios)
        run: .venv/bin/python -m pytest -q ../../../tests/scenarios

