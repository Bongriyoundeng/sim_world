name: python
on:
  push:
    branches: [main]
    paths: ["gis/**", "ai/**", ".github/workflows/python.yml"]
  pull_request:
    paths: ["gis/**", "ai/**", ".github/workflows/python.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [gis, ai]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run pytest
